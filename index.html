<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nopeustesti</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6E0812">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nopeustesti">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23FFD100'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23B3101F'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/bungee-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/share-tech-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Google Fonts (OFL), latin subset, self-hosted so the game works offline. */
  @font-face {
    font-family: 'Bungee';
    font-weight: 400;
    font-display: swap;
    src: url(fonts/bungee-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Rubik';
    font-weight: 300 900; /* variable font */
    font-display: swap;
    src: url(fonts/rubik-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Share Tech Mono';
    font-weight: 400;
    font-display: swap;
    src: url(fonts/share-tech-mono-latin.woff2) format('woff2');
  }

  /* Colours, fonts and sizes from the design canvas (844 × 390 px). */
  :root {
    --red: #B3101F;
    --red-dark: #8E0B1C;
    --red-darker: #6E0812;
    --yellow: #FFD100;
    --yellow-edge: #A88A00;
    --black: #141414;
    --white: #FFFFFF;
    --font-display: Bungee, Rubik, sans-serif;
    --font-digits: 'Share Tech Mono', monospace;
    --font-text: Rubik, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: var(--red-darker);
    color: var(--white);
    font-family: var(--font-text);
  }
  button { font: inherit; color: inherit; margin: 0; cursor: pointer; }

  /* The design is laid out at a fixed 844 × 390 and scaled uniformly to fit the
     usable area inside notches / home indicator (see fitStage()). */
  #viewport {
    position: fixed;
    inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #fit { position: relative; width: 100%; height: 100%; }
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 844px;
    height: 390px;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
  }
  .view {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--red);
    border: 6px solid var(--yellow);
    border-radius: 28px;
    overflow: hidden;
  }
  .view[hidden] { display: none; }
  .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
  }

  /* --- Start view ----------------------------------------------------------- */
  #viewStart {
    padding: 26px 44px;
    justify-content: center;
    gap: 18px;
  }
  .title-big {
    font-family: var(--font-display);
    font-size: 62px;
    line-height: 1;
    color: var(--yellow);
    letter-spacing: 1px;
    white-space: nowrap;
    text-shadow: 0 4px 0 var(--red-darker);
  }
  .start-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
  }
  .stats { display: flex; align-items: stretch; gap: 16px; }
  .stat-best {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--red-dark);
    border: 3px solid var(--yellow);
    border-radius: 14px;
    padding: 8px 18px;
    box-shadow: 0 5px 0 var(--red-darker);
  }
  .stat-best svg { width: 30px; height: 30px; }
  .stat-col { display: flex; flex-direction: column; gap: 2px; }
  .stat-best .value {
    font-family: var(--font-display);
    font-size: 34px;
    line-height: 1;
    color: var(--yellow);
  }
  .stat-last {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    background: var(--black);
    border: 3px solid var(--red-darker);
    border-radius: 12px;
    padding: 8px 18px;
  }
  .stat-last .label { color: var(--yellow); }
  .stat-last .value {
    font-family: var(--font-digits);
    font-size: 34px;
    line-height: 1;
    color: var(--yellow);
    letter-spacing: 4px;
  }
  #startBtn {
    flex: none;
    width: 184px;
    height: 184px;
    margin-right: 10px;
    border: none;
    border-radius: 50%;
    background: var(--yellow);
    color: var(--black);
    font-family: var(--font-display);
    font-size: 28px;
    letter-spacing: 1px;
    box-shadow: 0 10px 0 var(--yellow-edge), 0 0 0 10px var(--red-darker);
  }
  #startBtn:active {
    transform: translateY(5px);
    box-shadow: 0 5px 0 var(--yellow-edge), 0 0 0 10px var(--red-darker);
  }

  /* --- Game view ------------------------------------------------------------ */
  #viewGame {
    padding: 24px 40px 36px;
    align-items: center;
    justify-content: space-between;
  }
  .game-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    align-self: stretch;
  }
  .title-small {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--yellow);
    text-shadow: 0 3px 0 var(--red-darker);
  }
  .score-box {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--black);
    border: 4px solid var(--red-darker);
    border-radius: 14px;
    padding: 8px 22px;
  }
  .score-box .label { color: var(--yellow); }
  #score {
    font-family: var(--font-digits);
    font-size: 48px;
    line-height: 1;
    color: var(--yellow);
    letter-spacing: 6px;
    white-space: pre;
  }
  #gameBest {
    width: 150px;
    font-size: 14px;
    font-weight: 600;
    text-align: right;
  }
  #buttons {
    display: flex;
    align-items: center;
    gap: 44px;
    background: var(--red-dark);
    border-radius: 120px;
    padding: 22px 40px;
    box-shadow: inset 0 6px 0 var(--red-darker);
  }
  .btn {
    width: 132px;
    height: 132px;
    border: 6px solid var(--yellow);
    border-radius: 50%;
    background: var(--off);
    box-shadow: 0 8px 0 var(--edge);
    cursor: pointer;
    touch-action: none;
    will-change: transform;
    transition: transform 40ms ease-out;
  }
  .btn.lit, .btn.flash-on {
    background: radial-gradient(circle at 40% 35%, #FFFFFF 0%, var(--on) 45%);
    box-shadow: 0 8px 0 var(--edge), 0 0 40px 10px var(--on);
  }
  /* Pressed: the cap sinks onto its edge. */
  .btn.pressed { transform: translateY(4px); transition: none; box-shadow: 0 4px 0 var(--edge); }
  .btn.lit.pressed { box-shadow: 0 4px 0 var(--edge), 0 0 40px 10px var(--on); }
  .btn.flash { animation: flash 0.25s steps(2) infinite; }
  @keyframes flash {
    50% {
      background: radial-gradient(circle at 40% 35%, #FFFFFF 0%, var(--on) 45%);
      box-shadow: 0 8px 0 var(--edge), 0 0 40px 10px var(--on);
    }
  }

  /* --- Result view ---------------------------------------------------------- */
  #viewResult {
    padding: 28px 40px;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }
  .title-mid {
    font-family: var(--font-display);
    font-size: 40px;
    line-height: 1;
    color: var(--yellow);
    text-shadow: 0 4px 0 var(--red-darker);
  }
  .result-row { display: flex; align-items: center; gap: 24px; }
  .result-score {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: var(--black);
    border: 4px solid var(--red-darker);
    border-radius: 16px;
    padding: 14px 34px;
  }
  .result-score .label { color: var(--yellow); }
  #resultScore {
    font-family: var(--font-digits);
    font-size: 72px;
    line-height: 1;
    color: var(--yellow);
    letter-spacing: 8px;
  }
  .result-side { display: flex; flex-direction: column; gap: 10px; }
  #recordBadge {
    align-self: flex-start;
    background: var(--yellow);
    color: var(--black);
    font-weight: 700;
    font-size: 16px;
    padding: 8px 16px;
    border-radius: 30px;
  }
  #resultBest { font-size: 16px; line-height: 1.4; }
  .result-actions { display: flex; align-items: center; gap: 16px; }
  #againBtn {
    min-height: 44px;
    padding: 14px 30px;
    border: none;
    border-radius: 40px;
    background: var(--yellow);
    color: var(--black);
    font-family: var(--font-display);
    font-size: 20px;
    box-shadow: 0 6px 0 var(--yellow-edge);
  }
  #againBtn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--yellow-edge); }
  #homeBtn {
    min-height: 44px;
    padding: 14px 20px;
    border: 2px solid var(--white);
    border-radius: 40px;
    background: transparent;
    font-weight: 600;
    font-size: 16px;
  }
  #homeBtn:active { background: rgba(255, 255, 255, 0.12); }

  /* --- Sound / fullscreen icons: small and quiet, top-right of the card ------ */
  #tools {
    position: absolute;
    top: 16px;
    right: 20px;
    display: flex;
    gap: 8px;
  }
  #tools[hidden] { display: none; }
  .tool {
    width: 40px;
    height: 40px;
    padding: 9px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--yellow);
    opacity: 0.55;
  }
  .tool:active { opacity: 1; background: var(--red-dark); }
  .tool svg { display: block; width: 100%; height: 100%; }
  .tool[hidden], .tool svg[hidden] { display: none; }

  /* --- Portrait overlay ------------------------------------------------------- */
  #rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px;
    background: var(--red);
    box-shadow: inset 0 0 0 6px var(--yellow);
    text-align: center;
  }
  #rotate svg { width: 96px; height: 96px; color: var(--yellow); animation: rotate-hint 2s ease-in-out infinite; }
  #rotate div {
    font-family: var(--font-display);
    font-size: 26px;
    line-height: 1.2;
    color: var(--yellow);
    text-shadow: 0 3px 0 var(--red-darker);
  }
  @keyframes rotate-hint { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) {
    #rotate { display: flex; }
  }

  #debug {
    position: fixed;
    top: env(safe-area-inset-top);
    left: env(safe-area-inset-left);
    padding: 0.3rem 0.5rem;
    font: 12px ui-monospace, monospace;
    background: rgba(0, 0, 0, 0.6);
    pointer-events: none;
    white-space: pre;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="viewport"><div id="fit"><div id="stage">

  <section id="viewStart" class="view">
    <div class="title-big">NOPEUSTESTI</div>
    <div class="start-row">
      <div class="stats">
        <div class="stat-best">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="#FFD100" stroke="#FFD100" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/></svg>
          <div class="stat-col">
            <span class="label">ENNÄTYS</span>
            <span class="value" id="startBest">000</span>
          </div>
        </div>
        <div class="stat-last">
          <span class="label">EDELLINEN</span>
          <span class="value" id="startLast">---</span>
        </div>
      </div>
      <button id="startBtn">ALOITA</button>
    </div>
  </section>

  <section id="viewGame" class="view" hidden>
    <div class="game-head">
      <div class="title-small">NOPEUSTESTI</div>
      <div class="score-box">
        <span class="label">PISTEET</span>
        <span id="score" role="status" aria-label="Pisteet 0">000</span>
      </div>
      <div id="gameBest">Ennätys 000</div>
    </div>
    <div id="buttons"></div>
  </section>

  <section id="viewResult" class="view" hidden>
    <div class="title-mid">PELI PÄÄTTYI</div>
    <div class="result-row">
      <div class="result-score">
        <span class="label">PISTEET</span>
        <span id="resultScore">000</span>
      </div>
      <div class="result-side">
        <div id="recordBadge">Uusi ennätys!</div>
        <div id="resultBest">Edellinen ennätys 000</div>
      </div>
    </div>
    <div class="result-actions">
      <button id="againBtn">PELAA UUDESTAAN</button>
      <button id="homeBtn">Alkuun</button>
    </div>
  </section>

  <div id="tools">
    <button id="sound" class="tool" aria-label="Äänet päällä">
      <svg id="soundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>
      </svg>
      <svg id="soundOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/>
      </svg>
    </button>
    <button id="fullscreen" class="tool" aria-label="Koko näyttö" hidden>
      <svg id="fsEnter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
      </svg>
      <svg id="fsExit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
        <path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
      </svg>
    </button>
  </div>

</div></div></div>
<div id="rotate">
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
    <rect x="20" y="6" width="24" height="52" rx="4"/>
    <line x1="29" y1="51" x2="35" y2="51"/>
  </svg>
  <div>KÄÄNNÄ PUHELIN<br>VAAKATASOON</div>
</div>
<div id="debug" class="hidden"></div>

<script>
'use strict';

// All tunables in one place.
const CONFIG = {
  BUTTONS: [
    // Left to right. off/on: cap colour unlit/lit, edge: cap side;
    // tone: 1-based index into TONE_FREQS (red=1, yellow=2, green=3, blue=4).
    { name: 'yellow', off: '#7A6A1E', on: '#FFD100', edge: '#A88A00', tone: 2, label: 'Keltainen nappi' },
    { name: 'green',  off: '#1D5E33', on: '#2BD15F', edge: '#13702F', tone: 3, label: 'Vihreä nappi' },
    { name: 'blue',   off: '#25406E', on: '#3D8BFF', edge: '#173E85', tone: 4, label: 'Sininen nappi' },
    { name: 'red',    off: '#6E1A1E', on: '#FF4A4A', edge: '#8A0F14', tone: 1, label: 'Punainen nappi' },
  ],
  DIGITS: 3,             // scores are zero-padded to this many digits
  DESIGN_WIDTH: 844,     // the layout is designed at this size and scaled to fit
  DESIGN_HEIGHT: 390,
  // Tempo. The values measured from the original device (500 / 150 / 0.982 /
  // 0.999) felt too hard, so these are gentler.
  START_INTERVAL: 650,   // ms between lights at score 0
  MIN_INTERVAL: 180,     // ms, hard floor
  SCORE_FACTOR: 0.992,   // interval multiplier per point
  TIME_FACTOR: 0.998,    // interval multiplier per second played
  LIGHT_RATIO: 0.6,      // portion of the interval a light stays on
  // Falling behind: while the player lags, every new light shortens the
  // interval further, so the game soon ends. Catching up (queue below the
  // threshold) drops the extra speed and the normal curve applies again.
  MAX_BEHIND: 6,         // more unacknowledged lights than this ends the game (4-10)
  BEHIND_THRESHOLD: 2,   // queue length (before the new light) that counts as behind
  BEHIND_SPEEDUP: 0.96,  // extra interval multiplier per new light while behind (0.93-0.98)
  // Weight of the same colour coming again after it has come r times in a
  // row: index r-1 (capped at the last entry). The other colours weigh 1.
  REPEAT_WEIGHTS: [0.5, 0.15, 0],
  COUNTDOWN_STEP_MS: 700, // 3-2-1 before the game, per number
  GAME_OVER_VIEW_MS: 1200, // the failed button flashes this long before the result view
  RESULT_LOCK_MS: 400,   // result view ignores taps this long (no accidental restart)
  KEYS: ['KeyA', 'KeyS', 'KeyD', 'KeyF'], // desktop testing
  STORAGE_KEY: 'nopeustesti.best',
  LAST_KEY: 'nopeustesti.last', // score of the previous game
  MUTE_KEY: 'nopeustesti.muted',

  // Sound, measured from a recording of the original (1991). The original is a
  // piezo buzzer driven by a square wave; mostly the odd harmonics near the
  // buzzer resonance (~4.1-4.8 kHz) are audible.
  VOLUME: 0.5,              // master gain
  TONE_FREQS: [141.25, 183.2, 236.9, 316.5], // square wave f0, low to high
  BUZZER_RES_FREQ: 4300,    // resonance filter center, Hz
  BUZZER_RES_Q: 4.5,
  BUZZER_FILTER: 'bandpass', // or 'peaking'
  BUZZER_DRY: 0.08,         // share of unfiltered signal mixed in
  BUZZER_GAIN: 2.5,         // makeup gain; filtered output RMS is ~0.12
  FADE_MS: 4,               // fade in/out on every start/stop to avoid clicks
  TONE_SUSTAIN: true,       // tone plays until the next light (false: only while lit)
  PRESS_MUTE_MS: 220,       // every press silences the tone this long
  // Game over: a rough buzz through the same buzzer chain (audible on phone
  // speakers), lower than any game tone, fading out at the end.
  GAME_OVER_FREQ: 95,       // square wave f0, Hz; dense harmonics = rough buzz
  GAME_OVER_LEVEL: 0.8,     // relative to game tones
  GAME_OVER_MS: 800,
  GAME_OVER_FADE_OUT_MS: 250,
  COUNTDOWN_BEEP_MS: 70,    // short tick on 3, 2, 1 (0 = silent)
};

// --- Audio -----------------------------------------------------------------
// Everything is synthesized with Web Audio; no audio files. The AudioContext
// is created/resumed from a user gesture, which mobile browsers require.
const audio = {
  ctx: null,
  master: null,
  muted: false,
  voice: null,       // continuous game tone: { osc, out }
  voiceOn: false,
  oneShots: [],      // playing one-shot sounds: { osc, out }

  unlock() {
    if (!this.ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      this.ctx = new Ctx({ latencyHint: 'interactive' });
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : CONFIG.VOLUME;
      this.master.connect(this.ctx.destination);
      // iOS needs something to actually play inside the gesture.
      const src = this.ctx.createBufferSource();
      src.buffer = this.ctx.createBuffer(1, 1, 22050);
      src.connect(this.master);
      src.start();
    }
    // Also recovers from iOS "interrupted" state (calls, backgrounding).
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
  },

  setMuted(muted) {
    this.muted = muted;
    if (this.master) {
      this.master.gain.setTargetAtTime(muted ? 0 : CONFIG.VOLUME, this.ctx.currentTime, 0.01);
    }
  },

  // Square wave -> resonance filter (+ a little dry signal) -> out gain.
  // `out` starts silent; callers fade it in.
  createBuzzer(freq) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = freq;
    const filter = ctx.createBiquadFilter();
    filter.type = CONFIG.BUZZER_FILTER;
    filter.frequency.value = CONFIG.BUZZER_RES_FREQ;
    filter.Q.value = CONFIG.BUZZER_RES_Q;
    if (CONFIG.BUZZER_FILTER === 'peaking') filter.gain.value = 24;
    const dry = ctx.createGain();
    dry.gain.value = CONFIG.BUZZER_DRY;
    const out = ctx.createGain();
    out.gain.value = 0;
    osc.connect(filter).connect(out);
    osc.connect(dry).connect(out);
    out.connect(this.master);
    return { osc, out };
  },

  // Linear fade of a gain param from its current value, starting at time t.
  fade(param, target, t = this.ctx.currentTime) {
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
    param.linearRampToValueAtTime(target, t + CONFIG.FADE_MS / 1000);
  },

  // Plays node from t0 to t1 (AudioContext time) with fades at both ends.
  schedule(node, level, t0, t1, fadeOutMs = CONFIG.FADE_MS) {
    const fadeIn = CONFIG.FADE_MS / 1000;
    const fadeOut = Math.max(fadeOutMs, CONFIG.FADE_MS) / 1000;
    const g = node.out.gain;
    g.setValueAtTime(0, t0);
    g.linearRampToValueAtTime(level, t0 + fadeIn);
    g.setValueAtTime(level, Math.max(t0 + fadeIn, t1 - fadeOut));
    g.linearRampToValueAtTime(0, t1);
    node.osc.start(t0);
    node.osc.stop(t1 + 0.01);
  },

  stopNode(node) {
    const t = this.ctx.currentTime;
    this.fade(node.out.gain, 0, t);
    try { node.osc.stop(t + CONFIG.FADE_MS / 1000 + 0.01); } catch {}
  },

  // --- Game tone: one continuous buzzer whose pitch follows the lights.
  startVoice() {
    if (!this.ctx) return;
    this.stopVoice();
    this.stopOneShots();
    this.voice = this.createBuzzer(CONFIG.TONE_FREQS[0]);
    this.voice.osc.start();
    this.voiceOn = false;
  },

  // Pitch changes immediately, with no gap, as on the original.
  setTone(freq) {
    if (this.voice) this.voice.osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
  },

  setVoiceOn(on) {
    if (!this.voice || on === this.voiceOn) return;
    this.voiceOn = on;
    this.fade(this.voice.out.gain, on ? CONFIG.BUZZER_GAIN : 0);
  },

  stopVoice() {
    if (!this.voice) return;
    this.stopNode(this.voice);
    this.voice = null;
    this.voiceOn = false;
  },

  // --- One-shot sounds (game over, countdown ticks).
  oneShot(freq, level, ms, fadeOutMs) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + 0.005;
    const node = this.createBuzzer(freq);
    this.schedule(node, level, t0, t0 + ms / 1000, fadeOutMs);
    this.oneShots.push(node);
    node.osc.onended = () => {
      this.oneShots = this.oneShots.filter((n) => n !== node);
    };
  },

  // A low, rough buzz that fades out: clearly "over" without being harsh.
  gameOver() {
    this.stopVoice();
    this.stopOneShots();
    this.oneShot(
      CONFIG.GAME_OVER_FREQ,
      CONFIG.BUZZER_GAIN * CONFIG.GAME_OVER_LEVEL,
      CONFIG.GAME_OVER_MS,
      CONFIG.GAME_OVER_FADE_OUT_MS
    );
  },

  countdownBeep() {
    if (CONFIG.COUNTDOWN_BEEP_MS <= 0) return;
    const freqs = CONFIG.TONE_FREQS;
    this.oneShot(freqs[freqs.length - 1], CONFIG.BUZZER_GAIN * 0.6, CONFIG.COUNTDOWN_BEEP_MS);
  },

  stopOneShots() {
    for (const node of this.oneShots) this.stopNode(node);
    this.oneShots = [];
  },
};

try { audio.muted = localStorage.getItem(CONFIG.MUTE_KEY) === '1'; } catch {}

const $ = (id) => document.getElementById(id);
const buttonsEl = $('buttons');
const scoreEl = $('score');
const views = { start: $('viewStart'), game: $('viewGame'), result: $('viewResult') };
const toolsEl = $('tools');

const pad = (n) => String(n).padStart(CONFIG.DIGITS, '0');

// --- Scaling -----------------------------------------------------------------
// The whole layout keeps its proportions; the leftover space shows the dark
// red page background.
const fitEl = $('fit');
const stageEl = $('stage');
function fitStage() {
  const scale = Math.min(
    fitEl.clientWidth / CONFIG.DESIGN_WIDTH,
    fitEl.clientHeight / CONFIG.DESIGN_HEIGHT
  );
  stageEl.style.setProperty('--scale', scale);
}
new ResizeObserver(fitStage).observe(fitEl);
fitStage();

// Optional latency overlay: open the page with ?debug
const debug = new URLSearchParams(location.search).has('debug');
const debugEl = $('debug');
const debugInfo = { fps: 0, frames: 0, fpsSince: 0, inputDelay: 0, maxInputDelay: 0 };
if (debug) debugEl.classList.remove('hidden');

// Each button tracks its own active pointers, so multitouch works independently
// per button. Only pointerdown counts as a press; sliding a finger onto a button
// does nothing, just like a physical button.
const buttonEls = CONFIG.BUTTONS.map((b, i) => {
  const el = document.createElement('div');
  el.className = 'btn';
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', b.label);
  el.style.setProperty('--off', b.off);
  el.style.setProperty('--on', b.on);
  el.style.setProperty('--edge', b.edge);
  const pointers = new Set();

  el.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    pointers.add(e.pointerId);
    el.setPointerCapture?.(e.pointerId);
    el.classList.add('pressed');
    if (debug) trackInputDelay(e);
    press(i);
  });

  const release = (e) => {
    if (!pointers.delete(e.pointerId)) return;
    if (pointers.size === 0) el.classList.remove('pressed');
  };
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('lostpointercapture', release);

  buttonsEl.appendChild(el);
  return el;
});

function trackInputDelay(e) {
  // Time from the OS delivering the event to our handler running.
  const delay = performance.now() - e.timeStamp;
  debugInfo.inputDelay = delay;
  debugInfo.maxInputDelay = Math.max(debugInfo.maxInputDelay, delay);
}

function debugFrame(now) {
  debugInfo.frames++;
  if (now - debugInfo.fpsSince >= 1000) {
    debugInfo.fps = Math.round(debugInfo.frames * 1000 / (now - debugInfo.fpsSince));
    debugInfo.frames = 0;
    debugInfo.fpsSince = now;
  }
  debugEl.textContent =
    `fps ${debugInfo.fps}\n` +
    `input ${debugInfo.inputDelay.toFixed(1)} ms (max ${debugInfo.maxInputDelay.toFixed(1)})\n` +
    `interval ${state.phase === 'playing' ? currentInterval(now).toFixed(0) : '-'} ms\n` +
    `behind x${state.behindFactor.toFixed(3)}\n` +
    `queue ${state.queue.length}\n` +
    `wake lock ${wake.status()}`;
  requestAnimationFrame(debugFrame);
}

// Game state
const state = {
  phase: 'idle',      // idle | playing | over
  score: 0,
  countdown: 0,       // number currently shown in the 3-2-1 countdown
  queue: [],          // FIFO of lit-but-unacknowledged button indices
  behindFactor: 1,    // extra interval multiplier while the player lags
  startTime: 0,       // performance.now() of game start
  nextLightAt: 0,
  litIndex: -1,
  litUntil: 0,
  lastIndex: -1,
  runLength: 0,       // how many times lastIndex has come in a row
  muteUntil: 0,       // tone is silenced until this time after each press
  rafId: 0,
  timers: [],         // pending game-over timeouts, cleared on restart
};

const scores = { best: 0, last: null };
try {
  scores.best = parseInt(localStorage.getItem(CONFIG.STORAGE_KEY), 10) || 0;
  const last = parseInt(localStorage.getItem(CONFIG.LAST_KEY), 10);
  scores.last = Number.isFinite(last) ? last : null;
} catch {}

// --- Views -----------------------------------------------------------------
function showView(name) {
  for (const [key, el] of Object.entries(views)) el.hidden = key !== name;
  // The icons would be easy to hit by accident during play.
  toolsEl.hidden = name === 'game';
}

function showStart() {
  $('startBest').textContent = pad(scores.best);
  $('startLast').textContent = scores.last === null ? '---' : pad(scores.last);
  showView('start');
}

let resultShownAt = 0;
function showResult(score, newRecord, previousBest) {
  $('resultScore').textContent = pad(score);
  $('recordBadge').hidden = !newRecord;
  $('resultBest').textContent = newRecord
    ? `Edellinen ennätys ${pad(previousBest)}`
    : `Ennätys ${pad(scores.best)}`;
  resultShownAt = performance.now();
  showView('result');
}

function showScore(text) {
  scoreEl.textContent = text;
  scoreEl.setAttribute('aria-label', `Pisteet ${state.score}`);
}

function currentInterval(now) {
  const seconds = Math.max(0, (now - state.startTime) / 1000);
  return Math.max(
    CONFIG.MIN_INTERVAL,
    CONFIG.START_INTERVAL
      * CONFIG.SCORE_FACTOR ** state.score
      * CONFIG.TIME_FACTOR ** seconds
      * state.behindFactor
  );
}

// Weighted pick: the last colour gets a weight that drops with each repeat
// (REPEAT_WEIGHTS), the others weigh 1. The first light is uniform.
function pickButton() {
  const n = CONFIG.BUTTONS.length;
  const w = CONFIG.REPEAT_WEIGHTS;
  const weights = Array.from({ length: n }, (_, i) =>
    i === state.lastIndex ? w[Math.min(state.runLength, w.length) - 1] : 1);
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < n; i++) {
    r -= weights[i];
    if (r < 0) return i;
  }
  // Float rounding fallback: last colour with a non-zero weight.
  for (let i = n - 1; i >= 0; i--) if (weights[i] > 0) return i;
}

function setLit(index) {
  if (state.litIndex >= 0) buttonEls[state.litIndex].classList.remove('lit');
  state.litIndex = index;
  if (index >= 0) buttonEls[index].classList.add('lit');
}

function toneFreq(index) {
  return CONFIG.TONE_FREQS[CONFIG.BUTTONS[index].tone - 1];
}

// The game tone is on once the first light has come, unless a press muted it
// or (without TONE_SUSTAIN) the light has already gone out.
function updateVoice(now) {
  const on = state.phase === 'playing'
    && state.lastIndex >= 0
    && now >= state.muteUntil
    && (CONFIG.TONE_SUSTAIN || now < state.litUntil);
  audio.setVoiceOn(on);
}

// The game runs in phase 'playing' from the start; until startTime the score
// display shows a 3-2-1 countdown and presses are ignored.
function startGame() {
  state.timers.forEach(clearTimeout);
  state.timers = [];
  state.phase = 'playing';
  state.score = 0;
  state.queue = [];
  state.behindFactor = 1;
  state.lastIndex = -1;
  state.runLength = 0;
  state.muteUntil = 0;
  state.countdown = 0;
  audio.startVoice();
  const now = performance.now();
  state.startTime = now + 3 * CONFIG.COUNTDOWN_STEP_MS;
  state.nextLightAt = state.startTime;
  setLit(-1);
  buttonEls.forEach((el) => el.classList.remove('flash', 'pressed'));
  showScore(pad(0));
  $('gameBest').textContent = `Ennätys ${pad(scores.best)}`;
  showView('game');
  wake.acquire();
  cancelAnimationFrame(state.rafId);
  state.rafId = requestAnimationFrame(tick);
}

function tick(now) {
  if (state.phase !== 'playing') return;

  updateCountdown(now);
  if (state.litIndex >= 0 && now >= state.litUntil) setLit(-1);

  // Catch up on every light that is due; timestamps are absolute, so no drift.
  while (now >= state.nextLightAt) {
    const at = state.nextLightAt;
    if (state.queue.length >= CONFIG.BEHIND_THRESHOLD) state.behindFactor *= CONFIG.BEHIND_SPEEDUP;
    const interval = currentInterval(at);
    const index = pickButton();
    state.runLength = index === state.lastIndex ? state.runLength + 1 : 1;
    state.lastIndex = index;
    state.queue.push(index);
    state.litUntil = at + interval * CONFIG.LIGHT_RATIO;
    state.nextLightAt = at + interval;
    setLit(now < state.litUntil ? index : -1);
    audio.setTone(toneFreq(index));

    if (state.queue.length > CONFIG.MAX_BEHIND) {
      gameOver(index);
      return;
    }
  }

  updateVoice(now);
  state.rafId = requestAnimationFrame(tick);
}

function updateCountdown(now) {
  const n = now < state.startTime
    ? Math.ceil((state.startTime - now) / CONFIG.COUNTDOWN_STEP_MS)
    : 0;
  if (n === state.countdown) return;
  state.countdown = n;
  if (n > 0) {
    showScore(String(n).padStart(Math.ceil((CONFIG.DIGITS + 1) / 2)).padEnd(CONFIG.DIGITS));
    audio.countdownBeep();
  } else {
    showScore(pad(state.score));
  }
}

function press(index) {
  if (state.phase !== 'playing') return;
  const now = performance.now();
  if (now < state.startTime) return; // countdown still running
  state.muteUntil = now + CONFIG.PRESS_MUTE_MS;
  updateVoice(now);
  if (state.queue.length === 0 || state.queue[0] !== index) {
    gameOver(index);
    return;
  }
  state.queue.shift();
  if (state.queue.length < CONFIG.BEHIND_THRESHOLD) state.behindFactor = 1; // caught up
  state.score++;
  showScore(pad(state.score));
}

// Ends the game and records the score. flashIndex: button to flash before the
// result view; -1 (interrupted) goes straight to the result.
function gameOver(flashIndex) {
  state.phase = 'over';
  cancelAnimationFrame(state.rafId);
  setLit(-1);
  wake.release();

  const previousBest = scores.best;
  const newRecord = state.score > scores.best;
  scores.last = state.score;
  if (newRecord) scores.best = state.score;
  try {
    localStorage.setItem(CONFIG.LAST_KEY, String(scores.last));
    if (newRecord) localStorage.setItem(CONFIG.STORAGE_KEY, String(scores.best));
  } catch {}

  const score = state.score;
  if (flashIndex < 0) {
    audio.stopVoice();
    audio.stopOneShots();
    showResult(score, newRecord, previousBest);
    return;
  }
  audio.gameOver();
  buttonEls[flashIndex].classList.add('flash');
  state.timers.push(setTimeout(() => {
    buttonEls[flashIndex].classList.remove('flash');
    showResult(score, newRecord, previousBest);
  }, CONFIG.GAME_OVER_VIEW_MS));
}

// There is no pause: leaving the app or turning the phone ends the game. During
// the countdown nothing has happened yet, so it just returns to the start view.
function interrupt() {
  if (state.phase !== 'playing') return;
  if (performance.now() < state.startTime) {
    state.phase = 'idle';
    cancelAnimationFrame(state.rafId);
    audio.stopVoice();
    audio.stopOneShots();
    wake.release();
    showStart();
    return;
  }
  gameOver(-1);
}

$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', () => {
  if (performance.now() - resultShownAt < CONFIG.RESULT_LOCK_MS) return;
  startGame();
});
$('homeBtn').addEventListener('click', () => {
  if (performance.now() - resultShownAt < CONFIG.RESULT_LOCK_MS) return;
  state.phase = 'idle';
  showStart();
});

const soundEl = $('sound');
const updateSoundIcon = () => {
  $('soundOn').hidden = audio.muted;
  $('soundOff').hidden = !audio.muted;
  soundEl.setAttribute('aria-label', audio.muted ? 'Äänet pois' : 'Äänet päällä');
};
updateSoundIcon();
soundEl.addEventListener('click', () => {
  audio.setMuted(!audio.muted);
  try { localStorage.setItem(CONFIG.MUTE_KEY, audio.muted ? '1' : '0'); } catch {}
  updateSoundIcon();
});

// Unlock audio on any user gesture (capture phase, so it runs before the
// handlers above). touchend/click cover older iOS versions.
for (const type of ['pointerdown', 'touchend', 'click', 'keydown']) {
  document.addEventListener(type, () => audio.unlock(), { capture: true, passive: true });
}

// --- Fullscreen + landscape lock --------------------------------------------
// iPhone Safari has no element fullscreen; the button stays hidden there.
const fullscreenEl = $('fullscreen');
const root = document.documentElement;
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
// Installed as an app it already runs fullscreen/standalone; no button needed.
const installed = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches
  || navigator.standalone === true;
if (!installed && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
  fullscreenEl.hidden = false;
}

async function toggleFullscreen() {
  try {
    if (fsElement()) {
      await (document.exitFullscreen?.() ?? document.webkitExitFullscreen?.());
      return;
    }
    await (root.requestFullscreen?.({ navigationUI: 'hide' }) ?? root.webkitRequestFullscreen?.());
    // Orientation lock only works in fullscreen, and only on some platforms.
    await screen.orientation?.lock?.('landscape');
  } catch {
    // Unsupported or refused; the game works without it.
  }
}

const updateFullscreenIcon = () => {
  const on = Boolean(fsElement());
  $('fsEnter').hidden = on;
  $('fsExit').hidden = !on;
  fullscreenEl.setAttribute('aria-label', on ? 'Poistu koko näytöstä' : 'Koko näyttö');
};
fullscreenEl.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', updateFullscreenIcon);
document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

// --- Screen Wake Lock --------------------------------------------------------
// Keeps the screen on while a game is running. Requires a secure context
// (HTTPS or localhost). The browser drops the lock when the page is hidden.
const wake = {
  lock: null,
  async acquire() {
    if (this.lock || !('wakeLock' in navigator)) return;
    try {
      this.lock = await navigator.wakeLock.request('screen');
      this.lock.addEventListener('release', () => { this.lock = null; });
    } catch {
      this.lock = null;
    }
  },
  release() {
    this.lock?.release().catch(() => {});
    this.lock = null;
  },
  status() {
    if (!('wakeLock' in navigator)) return 'ei tuettu';
    return this.lock ? 'päällä' : 'pois';
  },
};

document.addEventListener('visibilitychange', () => {
  if (document.hidden) interrupt();
});

// Turning to portrait covers the game, so it ends.
matchMedia('(orientation: portrait)').addEventListener('change', (e) => {
  if (e.matches) interrupt();
});

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const i = CONFIG.KEYS.indexOf(e.code);
  if (i < 0) return;
  buttonEls[i].classList.add('pressed');
  if (debug) trackInputDelay(e);
  press(i);
});

document.addEventListener('keyup', (e) => {
  const i = CONFIG.KEYS.indexOf(e.code);
  if (i >= 0) buttonEls[i].classList.remove('pressed');
});

// Block browser gestures that would interfere: long-press menu, double-tap
// zoom, pinch zoom (iOS gesture* events), scrolling and rubber-banding.
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
// touchstart default is blocked only on the game buttons, so menu buttons
// still get their click events. This also stops iOS text-selection loupes.
buttonsEl.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

showStart();
if (debug) requestAnimationFrame(debugFrame);

// --- PWA: offline cache --------------------------------------------------------
// Service workers need a secure context (HTTPS or localhost); elsewhere
// navigator.serviceWorker is undefined and this is skipped.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
